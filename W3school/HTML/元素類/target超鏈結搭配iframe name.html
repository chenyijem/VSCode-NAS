<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>iframe name 屬性</h1>
    <iframe src="../../image-3c/flow.png" name="iframe_a" width="600" height="400">
        <p>您的瀏覽器不支援 iframe。</p>
    </iframe>
    <form action="">
        <a href="https://www.w3school.com.cn" target="iframe_a">W3School.com.cn</a>
    </form>
   
    <p><b>註解：</b>由於鏈接的 target 與 iframe 的 name 匹配，因此鏈接將在 iframe 中打開。</p>
</body>
</html>
