<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe 元素</title>
    <style>
       
    </style>
</head>
<body>
    <h1>iframe 元素 + CSS</h1>

<p>带有默认边框的 iframe：</p>
<iframe src="https://www.w3school.com.cn/tags/tag_iframe.asp" 
width="100%" height="200">
</iframe>
<br><br>   
<p>带有黑色细边框的 iframe：</p>
<iframe src="https://www.w3school.com.cn/tags/tag_iframe.asp" 
width="100%" height="200" style="border:5px solid black;">
</iframe>
<br><br>   
<p>无边框的 iframe：</p>
<iframe src="https://www.w3school.com.cn/tags/tag_iframe.asp"
 width="100%" height="200" style="border:none;">
</iframe>

</body>
</html>
