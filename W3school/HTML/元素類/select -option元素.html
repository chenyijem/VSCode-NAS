<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>select 元素</title>
    <style>
       
    </style>
</head>
<body>
    <h1>select 元素搭配 option</h1>

<form action="https://www.w3school.com.cn/tags/tag_select.asp" target="_blank">
  <label for="cars">请选择一个汽车品牌：</label>
  <select name="cars" id="cars">
    <option value="audi">奥迪</option>
	<option value="byd">比亚迪</option>
    <option value="geely">吉利</option>
	<option value="volvo">沃尔沃</option>
  </select>
  <br><br>
  <input type="submit" value="提交">
</form>

</body>
</html>
