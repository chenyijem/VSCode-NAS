<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5241ee;
        }

        li {
            float: left;
            /* 將列表項目水平排列 */
        }

        li a {
            display: block;
            color: rgb(133, 244, 175);
            text-align:center;
            padding: 16px;
            text-decoration: none;
        }

        ul {
            list-style-type: none;
        }

        li a:hover {
            background-color: #c6bfbf;
        }
        div {
            width: 300px;
            border: 5px solid #000;
        }
    </style>
</head>

<body>
    <!-- <h1>导航菜单</h1> -->

    <p>在此範例中，我們使用 CSS 將清單水平排列，以建立導覽選單：</p>
<div>
    <ul>
        <li><a href="#home">首頁</a></li>
        <li><a href="#news">新聞</a></li>
        <li><a href="#contact">聯系</a></li>
        <li><a href="#about">關於</a></li>
    </ul>
 </div>
    </body>
</body>

</html>
