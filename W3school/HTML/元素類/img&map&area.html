    <h1>img usemap 属性</h1>

<p>img 的usemap 属性与 map元素的 name 或 id 属性相关联，以建立 img 与 map 之间的关系。：</p>

<img src="../../image-3c/life.png" alt="Life" usemap="#lifemap" width="650" height="451">

<map name="lifemap">
  <area shape="rect" coords="10,208,155,338" alt="AirPods" href="../../image-3c/airpods.html">
  <area shape="rect" coords="214,65,364,365" alt="iPhone" href="../../image-3c/iphone.html">
  <area shape="circle" coords="570,291,75" alt="Coffee" href="../../image-3c/coffee.html">
  <p><a href="https://www.w3school.com.cn/tags/att_img_usemap.asp">map 配合 img area元素參考</a></p>
</map>
</body>
