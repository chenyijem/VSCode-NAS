<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HTML字符實體</title>
</head>
<body>
    <div>我 美女</div>
   <!-- &nbsp表示空格 -->
    <div>我&nbsp;&nbsp;&nbsp;&nbsp;美女</div>
    <div>我&#160;&#160;&#160;&#160;美女</div>
    <!-- &lt;表示小於<號，&gt;表示大於>號 -->
    <div>我們學習過很多的標題標籤，其中&lt;h1&gt;是最厲害的一個！</div>
    <!-- &amp;表示&號 -->
    <div>我們今天學習了一個可以表示空格的字符實體，它是：&amp;nbsp;</div>
    <div>我們今天學習了一個可以表示&的字符實體，它是：&amp;amp;</div>
    <div>當前商品的價格是：￥199</div>
    <div>當前商品的價格是：¥199</div>
    <!-- &yen;表示圓角號 ¥-->
    <div>當前商品的價格是：&yen;199</div>
    <!-- &copy;表示版權號© -->
    <div>©版權所有</div>
    <div>&copy;版權所有</div>
    <div>2 * 2 = 4</div>
    <div>2 x 2 = 4</div>
    <div>2 × 2 = 4</div>
    <!-- &times;表示乘號 × -->
    <div>2 &times; 2 = 4</div>
    <div>2 / 2 = 1</div>
    <div>2 ÷ 2 = 1</div>
    <!-- &divide;表示除號 ÷ -->
    <div>2 &divide; 2 = 1</div>
</body>
</html>
