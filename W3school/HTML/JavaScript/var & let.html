<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>var重新聲明變量</p>
    <p id="demo1"></p>
    <p>let重新聲明變量</p>
    <p id="demo2"></p>
     <p>在循环中使用 let</p>
    <p id="demo3"></p>
    <p id="demo4"></p>

<script>
var  x = 10;
// Here x is 10
{  
  var x = 3;
  // Here x is 2 var在塊內聲明的變量可以從塊外進行訪問
}
// Here x is 2
document.getElementById("demo1").innerHTML = x;

var  y = 11;
// Here y is 10
{  
  let y = 2;
  // Here y is 2 let在塊域內只作用在大括號域內塊外無法進行訪問
}
// Here y is 10
document.getElementById("demo2").innerHTML = y;

var i = 5;
for (var i = 0; i < 15; i++) {
  // 因為 var 沒有塊級作用域，迴圈裡面的 i 會直接覆蓋並修改外面的 i
}
document.getElementById("demo3").innerHTML = i;

let j = 5;
for (let j = 0; j < 10; j++) {
  // 迴圈內的 i：在 for (let j = 0; ...) 裡面宣告的 j，因為使用了 let，
  // 它只存活在 for 迴圈的大括號 {} 裡面。迴圈結束後，內部的 j 就消失了
}
document.getElementById("demo4").innerHTML = j;
</script>
</body>
</html>
