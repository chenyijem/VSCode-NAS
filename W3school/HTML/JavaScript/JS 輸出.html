<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS輸出</title>
    <style>
        div.scroll {
            overflow: auto;
            border: 1px solid red;
            width: 350px;
            /* padding: 3px;
            margin: 10px; */
        }
    </style>
    
</head>

<body>
    <h2>JavaScript 能够以不同方式“显示”数据：</h2>
    <div class="scroll">

        <ul>
            <li>使用 window.alert() 写入警告框</li>
            <li>使用 document.write() 写入 HTML 输出</li>
            <li>使用 innerHTML 写入 HTML 元素</li>
            <li>使用 console.log() 写入浏览器控制台</li>
        </ul>
    </div>
<p>script 需放在body內最後面,因瀏覽器在解析網頁時會由上往下依序執行。</p>
<p id="demo"></p>
<p id="demo1"></p>
<p id="demoAdd">加法</p>
<p id="demoFun">myFunction 定義段落</p>
<!-- <p id="demoAdd">加法運算</p> -->


<button type="button" onclick="myFunction()">Function鈕</button><br><br>
<button type="button" onclick="AddFunction()">加法運算</button><br><br>


<!--// 如下這個document.write方法僅在測試時才用,因會刪除 所有已有的 HTML內容 -->
<button onclick="document.write(5 + 6)">清空</button>
<script >
    /* window.alert("請注意");*/
        document.getElementById("demo").innerHTML = (5 + 6) *2;
        // document.write(9 + 6); 
    
function myFunction() {
    document.getElementById("demoFun").innerHTML = "段落被更改。";
  
}
function AddFunction() {
let x, y, z;  // 用;分隔多條
x = 22; y = 11; z = x + y;   
document.getElementById("demoAdd").innerHTML =
"z 的值是" + z + "。"; 
} 
var pi = 3.14;
var person = "Bill Gates";
var answer = 'How are you!';
document.getElementById("demo1").innerHTML =
pi + "<br>" + person + "<br>" + answer;
</script>


</body>
.
</html>
