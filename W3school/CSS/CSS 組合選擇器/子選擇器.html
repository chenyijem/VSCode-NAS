<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<head>
<style>
div > p {
  background-color: rgba(255, 217, 0, 0.532);
  border: 3px solid rgb(149, 40, 40);
}
</style>
</head>
<body>

<h1>子选择器 (>) 组合符</h1>

<div>
  <h2>唐老鸭</h2>
  <p>唐老鸭住在鸭堡。</p>
</div>

<div>
  <span><p>我不会被样式化。</p></span>
  <p>我将会被样式化。</p>
</div>

<p>唐老鸭最好的朋友是米老鼠。</p>

</body>
</html>
