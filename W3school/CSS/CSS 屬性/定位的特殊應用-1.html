<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位的特殊應用-1</title>
    <style>
        .outer1{
            height: 400px;
            background-color: rgb(124, 191, 250);
            position: relative;
        }
        .inner1{
            background-color: orange;
            font-size: 20px;
            padding: 20px;
            border: 10px solid black;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom:0;
        }
        .outer2{
            width: 800px;
            height: 400px;
            background-color: rgb(124, 191, 250);
            position: relative;
            text-align: center;
            /* font-size: 0; */
        }
        .inner2{
             width: 400px;
            height: 100px;
            background-color: orange;
            font-size: 20px;
            position: absolute;
            line-height: 100px;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="outer1">
        <div class="inner1">我要居中</div>
    </div>

    <div>固定定位的元素沒有設定高和寛時如要讓其充滿整個父元素(包容塊)
        則可在固定定位的元素內入加入left,right,top,bottom值為0.
    </div><br><hr>

    <div class="outer2">
        <div class="inner2">我要居中</div>
    </div>
    <div>固定定位的元素設有固定高和寛時如要讓其居中在整個父元素(包容塊)
        則可在固定定位的元素內入加入left,right,top,bottom值為0外,在加入margin:auto
    </div>
</body>
</html>
