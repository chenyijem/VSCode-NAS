<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字體複合屬性ment</title>
   <style>
    
    .myfont1{
        font:  bold 30px "標楷體";
        color: rgba(82, 3, 253, 0.7);
    }
    span{
        color: red;
        text-decoration: underline;
    }
   </style>
</head>
<body>
    <div class="myfont1">使用font 屬性時必需至少包括字體大小及字型名稱且順序寫在最後面
    例如 font:red bold <span>20px</span> <span>"標楷體"</span>
    </div>
</body>
</html>
