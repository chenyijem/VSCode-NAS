<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮動的個種問題及解決方法-3-1.</title>
    <style>
 

        .outer {
            width: 500px;
            height: auto;
            background-color: rgb(218, 247, 89);
            border: 2px solid rgb(1, 39, 255);
        }
        .box1,
        .box2,
        .box3,
        .box4
         {
            float: left;
        }
        .box5{
            clear: both;
        }

        .outer1 {
            width: 500px;
            /* height: 80px; */
            background-color: rgb(194, 246, 246);
            border: 1px solid black;
        }
        .outer1::after{
            content: ''; /*可以在''內加入內容看看有什麼變化*/
            display: block;
            clear: both;
        }

       
        .box {
            width: 100px;
            height: 100px;
            background-color: skyblue;
            border: 1px solid red;
            margin: 10px;
        }

    </style>
</head>

<body> 
       <div style="width: 500px">加一個box5空的內容的後
        加入 clear: both;來清除Box1~4的float影響.</div>
   <div class="outer">
       <div class="box box1">Box1</div>
       <div class="box box2">Box2</div>
       <div class="box box3">Box3</div>
       <div class="box box4">Box4</div>
       <div class="box5"></div>
    </div>
    <hr><hr>
    <div style="width: 500px">父盒子加一偽元素outer0::after模擬加一個空的box5
        並在其後面加入一個空的內容的後再清除Box1~4的float影響.(推薦)</div>
   
    <div class="outer1">
        <div class="box box1">Box1</div>
        <div class="box box2">Box2</div>
        <div class="box box3">Box3</div>
        <div class="box box4">Box4</div>
    </div>
    

   
   
    
</body>

</html>
