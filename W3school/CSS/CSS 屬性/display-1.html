<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display-1</title>
    <style>
        p {
            display: inline
        }

         div#noDisplay {
            display: none
        }
        [class ="test1"] {
            background-color: blueviolet;font-size: 25px;
        }

        h2 {
            display: block;color: red;
        }
        [title] {color: red; border: 3px solid blue;} /*[屬性]選擇器用[]*/
    </style>
</head>

<body>
    <p class="test1">本例中的样式表把段落元素设置为内联元素。</p>
    <div id="noDisplay">div display:none 元素的内容不会显示出来！</div>
    <div class="test1" >div display:none 元素的内容larger 字示出来！</div>
    <h2 title="this line will not show up.">這行<font color="black">display:block</font>元素的内容会显示出来！</h2>
</body>

</html>
