<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位-粘性定位</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    body{
        /* 將body的高度設得遠大於螢幕垂直解析度以產生側滾邊條 */
        height: 4000px;
        width: 500px;
    }
    .page-header {
        height: 100px;
        background-color: orange;
        text-align: center;
      
    }
    .item{
        background-color: rgb(166, 238, 238);
    }
/* 給元素設置position:stick即可實現粘性定位.top屬性值為sticky元素與
具滾邊條的父元素body基準的距離,通常top設為0 */
    .first{
        background-color: blue;
        font-size: 40px;
        color: azure;
        line-height: 60px;
        position: sticky;
        top: 0px;
    }
    .firstB{
        background-color: red;
       
    }
    .firstC{
        background-color: green;
           }
</style>

<body>
    
    <div class="page-header">給元素設置position:stick即可實現粘性定位.top屬性值為sticky元素與
                    具滾邊條的父元素body基準點的距離,通常top設為0 </div>
    <div class="item">
        <h2 class="first firstA">A1</h2>
        <h2>A2</h2>
        <h2>A3</h2>
        <h2>A4</h2>
        <h2>A5</h2>
        <h2>A6</h2>
        <h2>A7</h2>
        <h2>A8</h2>
        <h2>A9</h2>
        <h2>A10</h2>
    </div>
    <div class="item">
        <h2 class="first firstB">B1</h2>
        <h2>B2</h2>
        <h2>B3</h2>
        <h2>B4</h2>
        <h2>B5</h2>
        <h2>B6</h2>
        <h2>B7</h2>
        <h2>B8</h2>
        <h2>B9</h2>
        <h2>B10</h2>
    </div>
    <div class="item">
        <h2 class="first firstC">C1</h2>
        <h2>C2</h2>
        <h2>C3</h2>
        <h2>C4</h2>
        <h2>C5</h2>
        <h2>C6</h2>
        <h2>C7</h2>
        <h2>C8</h2>
        <h2>C9</h2>
        <h2>C10</h2>
    </div>
</body>

</html>
