<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


        .div1{
            width: 100px;
            height: 100px;
            padding: 20px; ;
            background-color: aqua;
            border: 10px solid red;
           
        }
        .div2{
            width: 100px;
            height: 100px;
            background-color: blue;
            border-color: red;
            border-style: solid;
            border-top-width: 10px;
            border-left-width: 8px;
        }
        .div3{
            width: 100px;
            height: 100px;
            background-color: yellow;
             border-style: double dashed groove dotted;
            border-color: brown blue green cyan;
            border-width: 10px 7px 15px 5px;
            
        }
        .div4{
            width: 100px;
            height: 100px;
            background-color: yellow;
            border: 10px solid red;
            border-top: none;
            
        }
    </style>
</head>
<body>
    <p>盒子內至少必需包含width height background-color border-style 4項 </p>
    <div class="div1"></div><br>
    <div class="div2"></div><br>
    <div class="div3"></div><br>
    <div class="div4"></div>
</body>
</html>
