<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin的注意事項1</title>
    <style>
      
        div{
            width: 400px;
            height: 100px;
            background-color: blueviolet;
            margin: 50px auto;
            padding: 10px;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    
    <div>margin的auto值 margin:50px auto;表示上下個50間距,在左右自動為居中</div>
    
</body>
</html>
