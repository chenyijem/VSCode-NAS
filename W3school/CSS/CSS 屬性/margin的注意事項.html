<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin的注意事項</title>
    <style>
        .s_all{
            font-size: 30px;
        }
        .s1{
            background-color: rgb(239, 171, 80);
            margin-right: 20px;margin-top: 100px;/*margin值top和bottom無作用*/
        }
        .s2{
            background-color: rgb(50, 176, 225);
            margin-left: 20px;
             margin-right: 40px;
        }
        .s3{
            background-color: rgb(233, 128, 249);
        }
        div{
            width: 400px;
            height: 200px;
            background-color: blueviolet;
            margin: 60px auto;
            padding: 20px;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <h3>行內元素margin只作用left及right,對top和bottom值無作用</h3>
    <span class="s_all s1 ">台北</span>
    <span class="s_all s2 ">台中</span>
    <span class="s_all s3 ">高雄</span>
    <div>margin:50px auto;表示該元素在其父元素內上下個50px間距,在左右自動為居中</div>
    
</body>
</html>
