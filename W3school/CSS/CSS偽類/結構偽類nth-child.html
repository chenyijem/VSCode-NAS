<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* an+1 例2n+1=2*(0~n)+1=1,3,5...奇數odd
         an+2 例2n=2*(0~n)=2,4,6...偶數even
         -n+4即選擇所有含4之前*/
        div.nth_c>p:nth-child(3){
            color: rgb(0, 38, 255);
        }
        div.nth_c>p:nth-child(6){ /*第6個不是p元素無法選中*/
            color: red;
        }
        div.nth_c>p:nth-last-child(4){ /*依div所有兒子中倒數的4個p*/
            color: blue;text-decoration:underline;
        }
        div.nth_c>p:nth-last-of-type(4){ /*依div兒子中只有同屬p中倒數的4個p*/
            color: rgb(175, 167, 23);text-decoration:underline;
        }
        
        div.nth_c>p:nth-of-type(6){ /*依div兒子中只有同屬p中第6個p*/
            color: red;
        }
        div.nth_c>p:last-of-type{ /*依div兒子中只有同屬p中最後一個心*/
            color: red;
        }
        div.nth_c>p:first-of-type{ /*屬於p元素裏的第一個*/
            color: rgb(0, 255, 119);
        }
        div.nth_even>p:nth-child(2n+1){
            color: blue;
            text-decoration:underline
        }
        div.nth_even>p:nth-child(2n){
            
            text-decoration: line-through;
        }
        div.nth_range>p:nth-child(-n+4){
             color: red;
            text-decoration: overline;
        }
        div.empty{
            width: 200px;
            height: 50px;
            background-color: rgb(77, 5, 233);
        }
        
        
    </style>
</head>
<body>
    <div class="nth_c">
       <span>測試1</span>
        <p>第一</p>
        <p>第二</p>
        <p>第三</p>
        <p>第四</p>
         <span>測試2</span>
        <p>第五</p>
        <p>第六</p>
        <p>第七</p>
        <p>第八</p>
        <p>第九</p>
        <p>第十</p>
          <span>測試3</span>
          </div>
<hr>
    <div class="nth_even">
        <p>第一</p>
        <p>第二</p>
        <p>第三</p>
        <p>第四</p>
        <p>第五</p>
        <p>第六</p>
        <p>第七</p>
        <p>第八</p>
    </div>
    <hr>
    <div class="nth_range">
        <p>第一</p>
        <p>第二</p>
        <p>第三</p>
        <p>第四</p>
        <p>第五</p>
        <p>第六</p>
        <p>第七</p>
        <p>第八</p>
    </div>

    <div class="empty"></div>
    
</body>
</html>
