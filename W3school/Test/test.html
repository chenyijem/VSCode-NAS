<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Hello, World!</p>
      <!-- …form 表單屬性有action, method, name, target 等 -->
    <h1>表單屬性種類 action, method,taget,name</h1>
    <P>form的name 属性用于在 JavaScript 中引用元素</P>
    <P>method 属性规定如何发送表单,URL变量使用 method="get"</P>
    <form name="myForm" action="https://www.w3school.com.cn/html/html_forms_attributes.asp" 
          method="get" target="_blank">
        <input type="checkbox" name="vehicle1" value="Bike">
        <label for="vehicle1">我有一辆自行车</label><br>
        <input type="checkbox" name="vehicle2" value="Car" checked>
        <label for="vehicle2">我有一辆汽车</label><br>
        <input type="submit" value="提交1"><br><br>
    </form>
    <table>
            <tr class="row" id="mytable"></tr>
    </table>
</body>
</html>
