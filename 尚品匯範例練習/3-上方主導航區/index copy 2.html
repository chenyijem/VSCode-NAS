<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尚品匯範例練習1</title>
    <!-- 引入頁標簽圖標 -->
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <!-- 引入重置樣式reset -->
    <link rel="stylesheet" href="./css/reset.css">
    <!-- 引入自定樣式index -->
    <link rel="stylesheet" href="./css/index.css">
    <style>
        /* 基礎設置 */
.container{
    width: 1190px;
     margin: 0 auto;
}

/* #region 頂部導航欄 */
.topbar{
    height: 30px;
    background-color: bisque;
}
/* 行內文字垂直居中 及font-size設置0來消除不同行空格*/
.welcome{
    height: 30px;
    line-height: 30px;
    font-size: 0;
    color: #666;
}
.welcome span , .welcome a{
    font-size: 12px;
}
.welcome .hello{
   margin-right: 28px;
}
.welcome .login {
    padding-right: 10px;
    border-right: 1px solid #666;
}
.welcome .register  {
    padding-left: 10px;
}
.topbar-nav .list li {
    float: left;
    /* font-size: 12px; */
}
.topbar-nav .list{
    height: 30px;
    line-height: 30px;
    /* font-size: 0; */
}
.topbar-nav .list li a{
    padding: 0 15px;
    border-right: 1px solid #666;
   
}
.topbar-nav .list li:first-child a{
    padding-left: 0;
}
.topbar-nav .list li:last-child a{
    padding-right: 0;
    border: 0;
}

/* #endregion 頂部導航欄 */
/* #region 頭部 */
.header{
    height: 120px;
    background-color: skyblue;
}
.header .search form{
   margin-top: 42px;
   /* line-height: 120px; */
    /*消除兩個水平塊間空隙用font-size: 0;
    因input和button有其預設font-size不受元素值影響*/
   font-size: 0;
    
}
.header .search input{
    width: 508px;
    height:34px;
    border: 1px solid #DD302D;
    
}
.header .search button{
    width: 80px;
    height: 36px;
    background-color: #DD302D;
    vertical-align: top;
    background-image: url("../images/serch_icon.png");
    background-repeat: no-repeat;
    background-position: center;
}

/* #endregion 頭部end*/

/* #region 上方主導航欄 */
.main-nav{
    height: 48px;
    border-bottom: 1px solid #DD302D;
}
.main-nav .all-types {
    width: 190px;
    height: 48px;
    line-height: 48px;
    font-size: 16px;
    color: #FFFFFF;
    background-color: #DD302D;
    text-align: center;
}

.main-nav-list {
    height: 48px;
    line-height: 48px;
}
.main-nav-list li{
   float: left;
   margin:0 10px;
   font-size: 16px;
}

    </style>
</head>

<body>
    <!--頂部導航欄 -->
    <div class="topbar">
        <!-- 版心 -->
        <div class="container clearfloat">
            <!-- 左側歡迎信息 -->
            <div class="welcome leftfloat">
                <span class="hello">尚品匯歡迎你</span>
                <span>請</span>
                <a class="login" href="#">登錄</a>
                <a class="register" href="#">免費註冊</a>
            </div>
            <!-- 右側導航菜單 -->
            <div class="topbar-nav rightfloat">
                <ul class="list clearfloat">
                    <li><a href="#">我的訂單</a></li>
                    <li><a href="#">我的購物車</a></li>
                    <li><a href="#">我的尚品匯</a></li>
                    <li><a href="#">尚品匯會員</a></li>
                    <li><a href="#">企業採購</a></li>
                    <li><a href="#">關注尚品匯</a></li>
                    <li><a href="#"> 合作招商</a></li>
                    <li><a href="#">商家后台</a></li>
                </ul>
            </div>
        </div>
    </div>
    <!--頭部 -->
    <div class="header">
        <div class="container clearfloat">
            <!-- 左側logo圖案 -->
            <div class="logo leftfloat">
                <img src="./images/logo.png" alt="尚品匯-logo">
            </div>
            <!--rightfloat搜索框 -->
            <div class="search rightfloat">
                <form action="#">
                    <input type="text">
                    <button></button>
                </form>
            </div>
        </div>

    </div>
    <!-- 上方主導航欄 -->
    <div class="main-nav">
        <div class="container clearfloat">
            <div class="all-types leftfloat">全部商品分類</div>
            <ul class="main-nav-list leftfloat clearfloat">
                <li><a href="#">尚品超市</a></li>
                <li><a href="#">優惠券</a></li>
                <li><a href="#">鞋靴</a></li>
                <li><a href="#">箱包</a></li>
                <li><a href="#">尚品生鮮</a></li>
                <li><a href="#">美妝</a></li>
                <li><a href="#">母嬰</a></li>
                <li><a href="#">居家生活</a></li>
                <li><a href="#">運動戶外</a></li>
                <li><a href="#">五金家店</a></li>

            </ul>
        </div>
    </div>
</body>

</html>
